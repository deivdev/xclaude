<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../../src/style.css" />
    <link rel="stylesheet" href="mockup.css" />
    <style>
      .dlg { display: block; position: static; margin: 0; }
      .dlg .plist { height: auto; }
    </style>
  </head>
  <body>
    <div class="dlg wide">
      <div class="pk">
        <h2>Riprendi una sessione</h2>
        <div class="field">
          <input type="text" placeholder="Cerca per titolo, cartella, branch o prompt" />
        </div>
        <div class="plist">
          <button class="ps sel" type="button"><span class="ti">Migrate auth to OAuth device flow</span><span class="tm">2 h fa</span><span class="pt">~/code/shop-api · feat/device-flow</span><span class="lp">now handle the refresh token expiring while the device code is pending</span></button>
          <button class="ps" type="button"><span class="ti">Fix dark mode flicker on load</span><span class="tm">aperta</span><span class="pt">~/code/web-app · fix/theme-flash</span><span class="lp">the page flashes white before switching to dark mode, fix it</span></button>
          <button class="ps" type="button"><span class="ti">Flaky e2e test on the cart page</span><span class="tm">5 h fa</span><span class="pt">~/code/web-app · main</span><span class="lp">run it 20 times and tell me which step times out</span></button>
          <button class="ps" type="button"><span class="ti">Bump the Postgres image to 17</span><span class="tm">aperta</span><span class="pt">~/code/infra · chore/pg17</span><span class="lp">check the extensions we use are available for 17 first</span></button>
          <button class="ps" type="button"><span class="ti">Translate the onboarding emails</span><span class="tm">1 g fa</span><span class="pt">~/code/mailer · main</span><span class="lp">keep the placeholders as they are, only translate the copy</span></button>
          <span class="lbl">Aperte in un altro terminale</span>
          <button class="ps" type="button" disabled><span class="ti">Profile the image resize worker</span><span class="tm">ora</span><span class="pt">~/code/media · perf/resize</span><span class="lp">where does the time go for a 40 MB TIFF?</span></button>
        </div>
      </div>
    </div>
  </body>
</html>
